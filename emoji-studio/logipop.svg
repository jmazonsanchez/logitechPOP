<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B55"/>
      <stop offset="100%" stop-color="#1E1B38"/>
    </linearGradient>
    <linearGradient id="popPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FFC800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Keyboard Keycap Accent (Heart Eyes / Pop button outline) -->
  <circle cx="64" cy="40" r="18" fill="#6C5CE7"/>
  <text x="64" y="48" font-size="22" text-anchor="middle" font-family="sans-serif">😍</text>

  <!-- POP Yellow Badge -->
  <rect x="22" y="74" width="84" height="34" rx="17" fill="url(#popPill)" filter="url(#shadow)"/>

  <!-- Logo Text: logi POP -->
  <text x="64" y="98" font-family="Ubuntu, Montserrat, system-ui, sans-serif" font-weight="900" font-size="20" fill="#18181B" text-anchor="middle" letter-spacing="0.5">logiPOP</text>
</svg>
