%YAML 1.3
# ==============================================================================
# rules.yaml - Solaar Automation Rules for Logitech POP Peripherals
# ==============================================================================
# Cuando presionas F1, F2 o F3 en el POP Keys (Host Switch Channel 1, 2 o 3),
# Solaar intercepta el evento e instruye al Logi POP Mouse a cambiar al mismo canal.
# Se recomienda usar 'released' para asegurar que el periférico registre el evento.
# ==============================================================================
---
- Rule:
    - Key: [Host Switch Channel 1, released]
    - Set: ["Logi POP Mouse", change-host, 1]
---
- Rule:
    - Key: [Host Switch Channel 2, released]
    - Set: ["Logi POP Mouse", change-host, 2]
---
- Rule:
    - Key: [Host Switch Channel 3, released]
    - Set: ["Logi POP Mouse", change-host, 3]
